name: Pipeline Freshness Investigation
trigger:
  incident_type: freshness
procedure:
  - step: retrieve_asset
    description: Retrieve affected asset
  - step: check_run_status
    description: Check last successful run status and timestamp across the pipeline
  - step: retrieve_lineage
    description: Retrieve upstream lineage (3-stage pipeline — find which stage stalled)
  - step: search_episodic
    description: Search episodic memory for a matching precedent
  - step: generate_fix
    description: Generate candidate fix (e.g. re-trigger the stalled stage, alert the owner)
success_metric:
  type: human_confirmed
  check: hitl_approval
