name: Default Investigation
trigger:
  incident_type: unclassified
procedure:
  - step: retrieve_asset
    description: Retrieve affected asset
  - step: retrieve_lineage
    description: Retrieve upstream and downstream lineage
  - step: search_episodic
    description: Search episodic memory for a matching precedent
  - step: generate_fix
    description: Generate candidate fix based on whatever evidence was gathered
success_metric:
  type: human_confirmed
  check: hitl_approval
